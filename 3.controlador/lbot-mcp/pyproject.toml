[project]
name = "lbot-mcp"
version = "0.1.0"
description = "LBot MCP Server and Harness - AI-powered E-Puck robot control"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.2",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "openai==2.41.0",
    "torch==2.12.0",
    "numpy==2.4.6",
    "opencv-python-headless==4.13.0.92",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "pytest-asyncio==1.4.0",
    "pytest==9.0.3",
    "ruff>=0.15,<1",
]

[project.scripts]
lbot-mcp-server = "mcp_server.server:main"
lbot-harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

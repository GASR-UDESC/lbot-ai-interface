[project]
name = "lbot-mcp"
version = "0.1.0"
description = "LBot MCP Server and Harness - AI-powered E-Puck robot control"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "torch>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
lbot-mcp-server = "mcp_server.server:main"
lbot-harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

<!-- ============================================================
     Game Page layout: header + 3-D simulator (left) + chat panel (right)
     ============================================================ -->
<div class="page-header">
  <h1 class="page-title">Jogar Desafios</h1>
  <p class="page-subtitle">Comande o robô com linguagem natural</p>
</div>

<div class="game-layout">

  <!-- ── Simulator panel ── -->
  <div class="simulator-panel">
    <div class="simulator-wrapper">
      <app-robo-simulator
        [showGoals]="true"
        [levelConfig]="currentLevelConfig()"
        (levelCompleted)="onLevelCompleted()"
      ></app-robo-simulator>

      <!-- HUD overlay -->
      <div class="hud" *ngIf="gameState.phase() === 'playing' || currentLevelCompleted()">
        <div class="hud-level">
          <span class="hud-label">NÍVEL {{ gameState.currentLevel() }}</span>
          <span class="hud-level-name">{{ currentLevelConfig()?.name }}</span>
        </div>
        <div class="hud-timer" *ngIf="!currentLevelCompleted()">{{ timerDisplay() }}</div>
        <div class="hud-complete-label" *ngIf="currentLevelCompleted()">NÍVEL COMPLETO!</div>
        <button class="hud-next-btn" *ngIf="currentLevelCompleted()" (click)="onNextLevel()">
          Próximo Nível →
        </button>
        <button class="hud-reset-btn" *ngIf="!currentLevelCompleted()" (click)="onResetRobot()">
          <lucide-icon [img]="RotateCcwIcon" [size]="16" style="vertical-align: middle;"></lucide-icon> Reiniciar Posição
        </button>
      </div>
    </div>
  </div>

  <!-- ── Chat panel ── -->
  <div class="chat-panel">
    <app-lbot-chat
      *ngIf="currentChatId()"
      [externalChatId]="currentChatId()!"
      [gameMode]="true"
      [currentLevelName]="currentLevelConfig()?.name"
    ></app-lbot-chat>
    <div *ngIf="!currentChatId()" class="chat-loading">
      <span>Carregando chat...</span>
    </div>
  </div>

</div>

<!-- ── Level transition overlay ── -->
<app-level-transition
  *ngIf="gameState.phase() === 'level-complete'"
  [levelNumber]="completedLevelNumber()"
  [levelName]="completedLevelName()"
  [levelTime]="lastLevelTimeFormatted()"
  [nextLevelName]="nextLevelName()"
  (nextLevel)="onNextLevel()"
></app-level-transition>

<!-- ── Victory screen overlay ── -->
<app-victory-screen
  *ngIf="gameState.phase() === 'run-complete'"
  [levelTimes]="gameState.levelTimes()"
  [levelNames]="levelNames()"
  [isSaving]="isSaving()"
  [saveError]="saveError()"
  (save)="onSaveLeaderboard($event)"
  (retrySave)="onRetrySave()"
  (playAgain)="onPlayAgain()"
></app-victory-screen>

<!-- ── Rating warning modal ── -->
<app-confirm-modal
  *ngIf="showRatingWarningModal()"
  title="Avaliação Necessária"
  [message]="ratingWarningMessage()"
  confirmText="Continuar assim mesmo"
  cancelText="Voltar ao chat"
  (confirm)="onConfirmContinue()"
  (cancel)="onCancelContinue()"
></app-confirm-modal>

<!-- ── Confirm exit modal ── -->
<app-confirm-modal
  *ngIf="showConfirmModal()"
  title="Sair do jogo?"
  message="Você vai perder todo o progresso do jogo. Tem certeza?"
  confirmText="Sim, sair"
  cancelText="Cancelar"
  (confirm)="onConfirmExit()"
  (cancel)="onCancelExit()"
></app-confirm-modal>

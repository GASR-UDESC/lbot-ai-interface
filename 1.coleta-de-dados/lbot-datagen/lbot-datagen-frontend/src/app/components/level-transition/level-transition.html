<div class="transition-overlay">
  <div class="transition-card">
    <div class="level-badge">Nível {{ levelNumber }}</div>
    <h1 class="level-complete-title">{{ levelName }} Completo!</h1>
    <div class="time-display">
      <span class="time-label">Tempo</span>
      <span class="time-value">{{ levelTime }}</span>
    </div>
    <div class="next-level-info" *ngIf="nextLevelName">
      <span class="next-label">Próximo</span>
      <span class="next-name">{{ nextLevelName }}</span>
    </div>
    <button class="next-btn" (click)="onNextLevel()">
      Próximo Nível →
    </button>
  </div>
</div>

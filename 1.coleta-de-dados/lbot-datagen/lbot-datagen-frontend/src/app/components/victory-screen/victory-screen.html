<div class="victory-overlay">
  <div class="victory-card">
    <div class="trophy-icon"><lucide-icon [img]="TrophyIcon" [size]="48"></lucide-icon></div>
    <h1 class="victory-title">Parabéns!</h1>
    <p class="victory-subtitle">Todos os níveis completos!</p>

    <!-- Total time -->
    <div class="total-time-display">
      <span class="total-time-label">Tempo Total</span>
      <span class="total-time-value">{{ formatTime(totalTime) }}</span>
    </div>

    <!-- Per-level times table -->
    <div class="times-table">
      <div class="times-row times-header">
        <span>Nível</span>
        <span>Nome</span>
        <span>Tempo</span>
      </div>
      <div class="times-row" *ngFor="let time of levelTimes; let i = index">
        <span class="level-num">{{ i + 1 }}</span>
        <span class="level-name-cell">{{ levelNames[i] || ('Nível ' + (i + 1)) }}</span>
        <span class="level-time">{{ formatTime(time) }}</span>
      </div>
    </div>

    <!-- Nickname input -->
    <div class="nickname-section">
      <label class="nickname-label" for="nickname-input">Seu Nome no Leaderboard</label>
      <input
        id="nickname-input"
        class="nickname-input"
        type="text"
        placeholder="Digite seu apelido..."
        maxlength="30"
        [(ngModel)]="nickname"
      />
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button class="play-again-btn" [disabled]="isSaving" (click)="onPlayAgain()">Jogar Novamente</button>
      <button
        class="save-btn"
        [disabled]="!nickname.trim() || isSaving"
        (click)="onSave()"
      >
        <span *ngIf="!isSaving">Salvar no Leaderboard</span>
        <span *ngIf="isSaving">Salvando...</span>
      </button>
    </div>

    <!-- Save error feedback -->
    <div class="save-error" *ngIf="saveError">
      <p class="save-error-msg">Erro ao salvar. Tente novamente.</p>
      <button class="save-retry-btn" (click)="onRetrySave()">Tentar novamente</button>
    </div>
  </div>
</div>

<nav class="top-nav" role="navigation" aria-label="Navegacao principal">
  <div class="nav-left">
    <span class="nav-logo">LBOT</span>
  </div>

  <div class="nav-center">
    <a routerLink="/menu" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Menu</a>
    <a routerLink="/game" routerLinkActive="nav-link--active" class="nav-link">Jogar</a>
    <a routerLink="/controls" routerLinkActive="nav-link--active" class="nav-link">Controle</a>
    <a routerLink="/leaderboard" routerLinkActive="nav-link--active" class="nav-link">Leaderboard</a>
  </div>

  <button class="nav-hamburger" (click)="toggleMenu()" aria-label="Abrir menu" aria-expanded="menuOpen()">
    <lucide-icon [img]="MenuIcon" *ngIf="!menuOpen()" size="24"></lucide-icon>
    <lucide-icon [img]="XIcon" *ngIf="menuOpen()" size="24"></lucide-icon>
  </button>

  <div class="nav-overlay" *ngIf="menuOpen()" (click)="closeMenu()">
    <div class="nav-overlay-content" (click)="$event.stopPropagation()">
      <div class="m-stripe"></div>
      <a routerLink="/menu" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact: true}" class="nav-overlay-link" (click)="closeMenu()">Menu</a>
      <a routerLink="/game" routerLinkActive="nav-link--active" class="nav-overlay-link" (click)="closeMenu()">Jogar</a>
      <a routerLink="/controls" routerLinkActive="nav-link--active" class="nav-overlay-link" (click)="closeMenu()">Controle</a>
      <a routerLink="/leaderboard" routerLinkActive="nav-link--active" class="nav-overlay-link" (click)="closeMenu()">Leaderboard</a>
    </div>
  </div>

  <div class="m-stripe"></div>
</nav>
